<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آشپزخانه مامان</title><link rel="stylesheet" href="/static/style.css"><body><main><header>👩‍🍳 <div><h1>آشپزخانه مامان</h1><p>غذای مورد نظرت رو انتخاب کن ❤️</p></div></header><form method="post" action="/order"><section><h2>🍽️ غذاهای امروز</h2><div class="foods">{% for f in foods %}<article><b>{{f.emoji}}</b><h3>{{f.name}}</h3><label>تعداد پرس</label><input type="number" name="food_{{f.id}}" min="0" value="0"></article>{% endfor %}</div></section><section><h2>📝 اطلاعات سفارش</h2><input name="customer" required placeholder="نام شما"><input name="phone" required placeholder="شماره تلفن"><textarea name="note" placeholder="توضیحات (اختیاری)"></textarea><button>ثبت سفارش 🍽️</button></section></form></main></body></html>
